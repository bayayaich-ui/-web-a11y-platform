name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm install

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Builder tous les services
        run: npx turbo build

      - name: Linter le code
        run: npx turbo lint

      - name: Lancer les tests
        run: npx turbo test --continue

      - name: Build Docker scanner-service
        run: docker build -f infra/docker/Dockerfile.scanner-service -t scanner-service .