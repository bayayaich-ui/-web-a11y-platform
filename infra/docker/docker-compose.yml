services:
  postgres:
    image: postgres:16-alpine
    container_name: a11y-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: a11y_user
      POSTGRES_PASSWORD: a11y_password
      POSTGRES_DB: a11y_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: a11y-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: a11y-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: a11y_user
      RABBITMQ_DEFAULT_PASS: a11y_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: a11y-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: a11y_user
      MINIO_ROOT_PASSWORD: a11y_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
